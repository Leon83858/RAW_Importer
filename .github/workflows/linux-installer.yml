name: Linux installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libayatana-appindicator3-dev libgtk-3-dev \
            libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev patchelf wget

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Linux installer
        run: scripts/build-linux-installer.sh --arch x86_64

      - name: Build Debian package
        run: scripts/build-deb-installer.sh

      - name: Build Arch package
        run: scripts/build-pacman-installer.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAW-Importer-linux-x86_64-packages
          path: |
            installer/RAW-Importer_*_linux_x86_64.zip
            installer/RAW-Importer_*_linux_x86_64.zip.sha256
            installer/raw-importer_*_amd64.deb
            installer/raw-importer_*_amd64.deb.sha256
            installer/raw-importer-*-x86_64.pkg.tar.zst
            installer/raw-importer-*-x86_64.pkg.tar.zst.sha256
          if-no-files-found: error
          retention-days: 30
