name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore C#.sln

      - name: Build
        run: dotnet build C#.sln -c Release --no-restore

      - name: Test
        run: dotnet test C#.sln -c Release --no-build

  build-artifacts:
    name: Build ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-latest
          - rid: osx-x64
            runner: macos-latest
          - rid: win-arm64
            runner: windows-latest
          - rid: win-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained app
        run: >-
          dotnet publish RawImporterCS.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o out/${{ matrix.rid }}

      - name: Create archive
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil

          rid = os.environ["RID"]
          tag = os.environ["TAG"]
          source = pathlib.Path("out") / rid
          target = pathlib.Path("dist") / f"RawImporterCS-{tag}-{rid}"
          target.parent.mkdir(parents=True, exist_ok=True)
          archive = shutil.make_archive(str(target), "zip", root_dir=str(source))
          print(f"Created archive: {archive}")
          PY
        env:
          RID: ${{ matrix.rid }}
          TAG: ${{ github.ref_name }}

      - name: Package macOS app bundle
        if: startsWith(matrix.rid, 'osx-')
        shell: bash
        run: |
          VERSION="${TAG#v}"
          app="dist/Raw Importer.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "out/${RID}/RawImporterCS" "$app/Contents/MacOS/RawImporterCS"
          cp applet.icns "$app/Contents/Resources/applet.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Raw Importer</string>
            <key>CFBundleDisplayName</key>
            <string>Raw Importer</string>
            <key>CFBundleIdentifier</key>
            <string>com.projectbuilder.rawimportercs</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>RawImporterCS</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleIconFile</key>
            <string>applet</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          PLIST
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" \
            "dist/RawImporter-${TAG}-${RID}.zip"
        env:
          RID: ${{ matrix.rid }}
          TAG: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: dist/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-artifacts
    runs-on: ubuntu-latest
    outputs:
      arm64_sha256: ${{ steps.checksums.outputs.arm64 }}
      x64_sha256: ${{ steps.checksums.outputs.x64 }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Calculate macOS app checksums
        id: checksums
        shell: bash
        run: |
          echo "arm64=$(sha256sum "dist/RawImporter-${TAG}-osx-arm64.zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "x64=$(sha256sum "dist/RawImporter-${TAG}-osx-x64.zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check tap token availability
        id: token
        shell: bash
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -n "$HOMEBREW_TAP_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out Homebrew tap
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Leon83858/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update Cask
        if: steps.token.outputs.available == 'true'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          ARM64_SHA256: ${{ needs.publish-release.outputs.arm64_sha256 }}
          X64_SHA256: ${{ needs.publish-release.outputs.x64_sha256 }}
        run: |
          version="${TAG#v}"
          mkdir -p tap/Casks
          cat > tap/Casks/raw-importer.rb <<CASK
          cask "raw-importer" do
            version "$version"

            on_arm do
              url "https://github.com/Leon83858/RAW_Importer/releases/download/v#{version}/RawImporter-v#{version}-osx-arm64.zip"
              sha256 "$ARM64_SHA256"
            end

            on_intel do
              url "https://github.com/Leon83858/RAW_Importer/releases/download/v#{version}/RawImporter-v#{version}-osx-x64.zip"
              sha256 "$X64_SHA256"
            end

            name "Raw Importer"
            desc "Desktop app for importing and organizing RAW photo files"
            homepage "https://github.com/Leon83858/RAW_Importer"

            depends_on macos: ">= :big_sur"

            app "Raw Importer.app"
          end
          CASK

          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Casks/raw-importer.rb
          if git -C tap diff --cached --quiet; then
            echo "The Homebrew Cask is already up to date."
            exit 0
          fi
          git -C tap commit -m "Update raw-importer to ${version}"
          git -C tap push

      - name: Explain missing tap token
        if: steps.token.outputs.available != 'true'
        run: echo "::warning::Set HOMEBREW_TAP_TOKEN to a token with write access to Leon83858/homebrew-tap to publish future Cask updates automatically."
