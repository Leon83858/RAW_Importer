[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]
# The Tauri shell needs a WebView toolchain (WebKitGTK on Linux, Xcode CLT on
# macOS). The core is built and tested on its own by default.
default-members = ["crates/core"]

[workspace.package]
version = "3.0.0-dev"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Leon83858/RAW_Importer"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
ts-rs = "12.0.1"
semver = "1.0.28"
